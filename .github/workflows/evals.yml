# Harness evals — runs the eval suites (skills/agents/workflow) that are actually affected by a
# PR's diff, on OpenRouter/DeepSeek so it never touches anyone's Claude Code subscription.
#
# Change detection is `evals/scripts/ci-detect.mjs` (already in-repo, no deps): it maps changed
# files to the eval folders that cover them and SKIPS (not fails) any artifact with no evals yet.
#
#   .claude/skills/<name>/**  → evals/skills/<name>   (content tier — no proxy, DeepSeek native)
#   .claude/agents/<name>.md  → evals/agents/<name>   (tool tier — needs the LiteLLM proxy)
#   CLAUDE.md / any agent /
#   evals/workflow/** /
#   evals/src/**              → the workflow tier      (tool tier — needs the LiteLLM proxy)
#
# Model is a single knob, set once below — EVAL_MODEL / EVAL_JUDGE_MODEL — no UI, no code change
# needed to swap it later (see evals/README.md, "Runners: Claude Code vs OpenRouter").
#
# DeepSeek is known (measured in evals/README.md) to skip subagent dispatch on the tool tier — it
# does the work inline instead of calling Task/Agent. So agent-evals and workflow-evals run
# non-blocking (continue-on-error) until that's re-measured against a different model. skill-evals
# is content-only (no tool use asserted) and stays blocking.
name: evals

on:
  pull_request:
    paths:
      - '.claude/**'
      - 'CLAUDE.md'
      - 'evals/**'
  workflow_dispatch: {} # manual fallback — dispatch on any branch when a PR event doesn't fire

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  EVAL_MODEL: deepseek/deepseek-chat
  EVAL_JUDGE_MODEL: deepseek/deepseek-chat
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  detect:
    name: detect affected evals
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      agents: ${{ steps.detect.outputs.agents }}
      run_workflow: ${{ steps.detect.outputs.run_workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed files
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > /tmp/changed-files.txt
          else
            # workflow_dispatch: no PR diff to read — treat every existing skill/agent + CLAUDE.md
            # as touched so a manual run exercises the whole suite.
            : > /tmp/changed-files.txt
            echo "CLAUDE.md" >> /tmp/changed-files.txt
            for d in .claude/skills/*/; do echo "${d}SKILL.md" >> /tmp/changed-files.txt; done
            for f in .claude/agents/*.md; do echo "$f" >> /tmp/changed-files.txt; done
          fi
          cat /tmp/changed-files.txt >&2

      - name: Run ci-detect.mjs
        id: detect
        working-directory: evals
        env:
          CHANGED_FILES_FILE: /tmp/changed-files.txt
        run: |
          CHANGED_FILES="$(cat "$CHANGED_FILES_FILE")" node scripts/ci-detect.mjs

  skill-evals:
    name: skill-evals (${{ matrix.skill }})
    needs: detect
    if: needs.detect.outputs.skills != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1 # keep concurrent OpenRouter load low — see evals/README.md rate-limit note
      matrix:
        skill: ${{ fromJson(needs.detect.outputs.skills) }}
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Content tier only — talks to OpenRouter directly, no proxy needed for DeepSeek.
      # Trailing slash matters: without it "agents/architecture-reviewer" is a path PREFIX of
      # "agents/architecture-reviewer-lite/..." and vitest would run both suites in one job.
      - run: pnpm vitest run "skills/${{ matrix.skill }}/"

  agent-evals:
    name: agent-evals (${{ matrix.agent }})
    needs: detect
    if: needs.detect.outputs.agents != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true # tool tier: DeepSeek is known not to dispatch subagents reliably
    strategy:
      fail-fast: false
      max-parallel: 1 # keep concurrent OpenRouter load low — see evals/README.md rate-limit note
      matrix:
        agent: ${{ fromJson(needs.detect.outputs.agents) }}
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Tool tier: the Agent SDK needs an Anthropic-shaped endpoint. LiteLLM translates that to
      # DeepSeek on OpenRouter (see evals/proxy/litellm.config.yaml).
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      # Trailing slash: same prefix-collision reason as skill-evals above.
      - run: pnpm vitest run "agents/${{ matrix.agent }}/"
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down

  workflow-evals:
    name: workflow-evals
    needs: [detect, agent-evals] # serialize after agent-evals — same OPENROUTER_API_KEY, avoid concurrent rate-limits
    if: always() && needs.detect.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true # tool tier: DeepSeek is known not to dispatch subagents reliably
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - run: pnpm eval:workflow
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
